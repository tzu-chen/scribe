<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Scribe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/src/scribe.svg">
    <!-- Resolve the active theme before first paint to avoid a white flash.
         Mirrors the dark/light decision in src/contexts/ThemeContext.tsx +
         src/services/themeStorage.ts. The matching [data-theme="dark"] block in
         global.css supplies the colors so the very first paint is already dark. -->
    <script>
      (function() {
        try {
          var DARK = { dark: 1, 'default-dark': 1, 'solarized-dark': 1, nord: 1, dracula: 1 };
          function isDark(id) { return !!(id && DARK[id]); }
          var dark = false;
          var auto = null;
          try { auto = JSON.parse(localStorage.getItem('scribe_theme_auto')); } catch (e) {}
          if (auto && auto.enabled) {
            var hour = new Date().getHours();
            var isDay = hour >= auto.dayStartHour && hour < auto.nightStartHour;
            dark = isDark(isDay ? auto.lightSchemeId : auto.darkSchemeId);
          } else {
            dark = isDark(localStorage.getItem('scribe_theme'));
          }
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
